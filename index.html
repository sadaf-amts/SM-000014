<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Shared Board — SM-000014</title>
  <style>
    :root {
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #16202a;
      --muted: #5c6b7a;
      --accent: #0f6cbd;
      --accent-hover: #0b5394;
      --border: #dce3ec;
      --ok-bg: #e7f6ec;
      --ok-text: #136f3b;
      --warn-bg: #fff6e5;
      --warn-text: #8a5300;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    .app {
      max-width: 820px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 16px;
    }

    .title-group h1 {
      margin: 0 0 4px;
      font-size: 1.2rem;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--warn-bg);
      color: var(--warn-text);
    }

    .badge.live {
      background: var(--ok-bg);
      color: var(--ok-text);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    input, select, button {
      font: inherit;
      border-radius: 8px;
      border: 1px solid var(--border);
      padding: 10px 12px;
    }

    input, select {
      background: #fff;
      color: var(--text);
      flex: 1 1 180px;
    }

    button {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      background: var(--accent-hover);
    }

    button.secondary {
      background: #fff;
      color: var(--text);
      border-color: var(--border);
    }

    button.secondary:hover {
      background: #f0f4f8;
    }

    button.danger {
      background: #c62828;
      border-color: #c62828;
      padding: 6px 10px;
      font-size: 0.82rem;
    }

    .item-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      background: #fafbfd;
    }

    .item-title {
      font-weight: 600;
    }

    .item-meta {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .item-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .hidden {
      display: none !important;
    }

    .msg {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title-group">
        <h1>Live Shared Board</h1>
        <div class="status-row">
          <span id="modeBadge" class="badge">Connecting...</span>
          <span id="userLabel">Not signed in</span>
        </div>
      </div>
      <div id="authControls" class="row">
        <input id="emailInput" type="email" placeholder="User email" />
        <input id="passwordInput" type="password" placeholder="Password (6+ chars)" />
        <button id="signInBtn" type="button">Sign In</button>
        <button id="signUpBtn" type="button" class="secondary">Create Account</button>
        <button id="signOutBtn" type="button" class="secondary hidden">Sign Out</button>
      </div>
    </div>

    <div id="authNotice" class="card">
      <strong>Instant New-User Access:</strong> Click <em>Create Account</em> with an email and password to create a user and access the board immediately.
      <div id="authMessage" class="msg"></div>
    </div>

    <div id="boardSection" class="card hidden">
      <form id="itemForm" class="row">
        <input id="itemInput" type="text" placeholder="Add or update a live item..." required />
        <select id="statusSelect">
          <option value="Open">Open</option>
          <option value="In Progress">In Progress</option>
          <option value="Done">Done</option>
        </select>
        <button type="submit">Save Live</button>
      </form>
      <div id="boardMessage" class="msg"></div>
    </div>

    <div class="card">
      <ul id="itemList" class="item-list"></ul>
      <div id="emptyState" class="msg">No live items yet.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://tlevziakjdepeaxelglc.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_OX57vW7rgL2bIWWSOWPg2w_cEvOOuRA";

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let items = [];

    const modeBadge = document.getElementById("modeBadge");
    const userLabel = document.getElementById("userLabel");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const signInBtn = document.getElementById("signInBtn");
    const signUpBtn = document.getElementById("signUpBtn");
    const signOutBtn = document.getElementById("signOutBtn");
    const authNotice = document.getElementById("authNotice");
    const authMessage = document.getElementById("authMessage");
    const boardSection = document.getElementById("boardSection");
    const itemForm = document.getElementById("itemForm");
    const itemInput = document.getElementById("itemInput");
    const statusSelect = document.getElementById("statusSelect");
    const boardMessage = document.getElementById("boardMessage");
    const itemList = document.getElementById("itemList");
    const emptyState = document.getElementById("emptyState");

    function setAuthUI(user) {
      currentUser = user;
      const signedIn = Boolean(user);

      userLabel.textContent = signedIn
        ? `Signed in as ${user.email}`
        : "Not signed in";

      emailInput.classList.toggle("hidden", signedIn);
      passwordInput.classList.toggle("hidden", signedIn);
      signInBtn.classList.toggle("hidden", signedIn);
      signUpBtn.classList.toggle("hidden", signedIn);
      signOutBtn.classList.toggle("hidden", !signedIn);
      authNotice.classList.toggle("hidden", signedIn);
      boardSection.classList.toggle("hidden", !signedIn);
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderItems() {
      itemList.innerHTML = "";
      emptyState.classList.toggle("hidden", items.length > 0);

      for (const item of items) {
        const li = document.createElement("li");
        li.className = "item";
        li.innerHTML = `
          <div>
            <div class="item-title">${escapeHtml(item.title)}</div>
            <div class="item-meta">
              Status: <strong>${escapeHtml(item.status)}</strong> ·
              By ${escapeHtml(item.updated_by || "user")} ·
              ${new Date(item.updated_at).toLocaleTimeString()}
            </div>
          </div>
          <div class="item-actions">
            <button type="button" class="secondary" data-cycle="${escapeHtml(item.id)}">Cycle Status</button>
            <button type="button" class="danger" data-delete="${escapeHtml(item.id)}">Delete</button>
          </div>
        `;
        itemList.appendChild(li);
      }
    }

    async function loadItems() {
      const { data, error } = await sb
        .from("board_items")
        .select("*")
        .order("updated_at", { ascending: false });

      if (error) {
        boardMessage.textContent = `Load error: ${error.message}`;
        return;
      }
      items = data || [];
      renderItems();
    }

    function subscribeRealtime() {
      sb.channel("sm-000014-board-live")
        .on(
          "postgres_changes",
          { event: "*", schema: "public", table: "board_items" },
          () => {
            loadItems();
          }
        )
        .subscribe((status) => {
          if (status === "SUBSCRIBED") {
            modeBadge.textContent = "Supabase Live Sync";
            modeBadge.classList.add("live");
          }
        });
    }

    signUpBtn.addEventListener("click", async () => {
      authMessage.textContent = "";
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || password.length < 6) {
        authMessage.textContent = "Enter a valid email and a password of at least 6 characters.";
        return;
      }

      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) {
        authMessage.textContent = error.message;
        return;
      }

      if (data.session?.user) {
        setAuthUI(data.session.user);
        await loadItems();
      } else {
        authMessage.textContent =
          "Account created. Disable 'Confirm email' in Supabase Auth settings if you want instant sign-in right after sign-up.";
      }
    });

    signInBtn.addEventListener("click", async () => {
      authMessage.textContent = "";
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        authMessage.textContent = error.message;
        return;
      }
      setAuthUI(data.user);
      await loadItems();
    });

    signOutBtn.addEventListener("click", async () => {
      await sb.auth.signOut();
      setAuthUI(null);
    });

    itemForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUser) {
        boardMessage.textContent = "Sign in first.";
        return;
      }
      const title = itemInput.value.trim();
      const status = statusSelect.value;
      if (!title) return;

      const newItem = {
        id: crypto.randomUUID(),
        title,
        status,
        updated_by: currentUser.email,
        updated_at: new Date().toISOString()
      };

      const { error } = await sb.from("board_items").insert(newItem);
      if (error) {
        boardMessage.textContent = `Save failed: ${error.message}`;
        return;
      }
      itemInput.value = "";
      boardMessage.textContent = "Saved and broadcast live.";
      await loadItems();
    });

    itemList.addEventListener("click", async (e) => {
      const cycleId = e.target.getAttribute("data-cycle");
      const deleteId = e.target.getAttribute("data-delete");
      const order = ["Open", "In Progress", "Done"];

      if (cycleId) {
        const target = items.find((x) => x.id === cycleId);
        if (!target) return;
        const nextStatus = order[(order.indexOf(target.status) + 1) % order.length];

        const { error } = await sb
          .from("board_items")
          .update({
            status: nextStatus,
            updated_by: currentUser?.email || "user",
            updated_at: new Date().toISOString()
          })
          .eq("id", cycleId);

        if (error) boardMessage.textContent = error.message;
        else await loadItems();
      }

      if (deleteId) {
        const { error } = await sb.from("board_items").delete().eq("id", deleteId);
        if (error) boardMessage.textContent = error.message;
        else await loadItems();
      }
    });

    (async function init() {
      const { data: { session } } = await sb.auth.getSession();
      setAuthUI(session?.user || null);
      await loadItems();
      subscribeRealtime();

      sb.auth.onAuthStateChange((_event, nextSession) => {
        setAuthUI(nextSession?.user || null);
        loadItems();
      });
    })();
  </script>
</body>
</html>
