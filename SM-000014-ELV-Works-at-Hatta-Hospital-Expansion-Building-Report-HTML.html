            const id = parts.pop();
            const colKey = `STORAGE_${parts.join('/')}`;
            if (!grouped[colKey]) {
              const existing = localStorage.getItem(colKey);
              grouped[colKey] = existing ? JSON.parse(existing) : [];
            }
            const idx = grouped[colKey].findIndex((x) => x.id === id);
            if (op.type === 'set') {
              if (idx >= 0) grouped[colKey][idx] = op.data;
              else grouped[colKey].push(op.data);
            } else if (op.type === 'update' && idx >= 0) {
              grouped[colKey][idx] = { ...grouped[colKey][idx], ...op.data };

function evaluateCableStatus(cable) {
  const fieldComplete =
    Boolean(cable.pulling) &&
    Boolean(cable.termination) &&
    Boolean(cable.deviceInstallField);

  const isComplete = cable.backendInScope
    ? fieldComplete && Boolean(cable.backendDone)
    : fieldComplete;

  if (isComplete) return 'COMPLETED';

  const anyStarted =
    Boolean(cable.pulling) ||
    Boolean(cable.termination) ||
    Boolean(cable.deviceInstallField) ||
    (cable.backendInScope && Boolean(cable.backendDone));

  return anyStarted ? 'IN_PROGRESS' : 'NOT_STARTED';
}

// Enforces strict sequence:
// 1) Pulling must be done before Termination
// 2) Both Pulling AND Termination must be done before Installation (Field Device / Backend)
// Also if Pulling is unchecked, downstream stages are cleared automatically to preserve integrity.
function enforceStageDependencies(currentCable, patch) {
  const next = { ...currentCable, ...patch };

  if (patch.pulling === false) {
    next.pulling = false;
    next.termination = false;
    next.deviceInstallField = false;
    next.backendDone = false;
    return { allowed: true, patch: { pulling: false, termination: false, deviceInstallField: false, backendDone: false } };
  }

  if (patch.termination === true && !next.pulling) {
    return {
      allowed: false,
      reason: 'Termination cannot be marked done until Cable Pulling is completed.'
    };
  }

  if (patch.termination === false) {
    next.termination = false;
    next.deviceInstallField = false;
    next.backendDone = false;
    return { allowed: true, patch: { termination: false, deviceInstallField: false, backendDone: false } };
  }

  if (patch.deviceInstallField === true && (!next.pulling || !next.termination)) {
    return {
      allowed: false,
      reason: 'Installation can only be done after both Cable Pulling and Termination are completed.'
    };
  }

  if (patch.backendDone === true && (!next.pulling || !next.termination)) {
    return {
      allowed: false,
      reason: 'Backend installation/commissioning requires both Cable Pulling and Termination to be completed first.'
    };
  }

  // Normalize any existing inconsistent state on toggle
  if (!next.pulling && (next.termination || next.deviceInstallField || next.backendDone)) {
    next.termination = false;
    next.deviceInstallField = false;
    next.backendDone = false;
  } else if (!next.termination && (next.deviceInstallField || next.backendDone)) {
    next.deviceInstallField = false;
    next.backendDone = false;
  }

  const finalPatch = {};
  Object.keys(patch).forEach((k) => {
    finalPatch[k] = next[k];
  });
  if (patch.pulling === false) {
    finalPatch.termination = false;
    finalPatch.deviceInstallField = false;
    finalPatch.backendDone = false;
  }
  if (patch.termination === false) {
    finalPatch.deviceInstallField = false;
    finalPatch.backendDone = false;
  }

  return { allowed: true, patch: finalPatch };
}

function generateSystemScheduleRecords(updatedBy = 'System Seed') {
  const idfs = ['MDF', 'IDF-01', 'IDF-02', 'IDF-03', 'IDF-04'];
  const rooms = [
    'Main Lobby',
    'Outpatient Wing',
    'Corridor North',
    'Corridor South',
    'Lift Lobby',
    'Server Room',
    'Emergency Reception',
    'Service Corridor',
    'Stairwell A',
    'Hospital Entrance'
  ];

  const records = [];
  let slCounter = 1;

  ELV_SYSTEM_DEFINITIONS.forEach((sysDef, sysIdx) => {
    const qty = sysDef.count || 1;
    const doorsCount = sysDef.code === 'ACS' ? 55 : 0;

    for (let j = 1; j <= qty; j++) {
      const i = slCounter++;
      const floor = sysDef.scopeFloors[(j - 1) % sysDef.scopeFloors.length];
      const idf = idfs[(j - 1) % idfs.length];
      const room = rooms[(i * 3) % rooms.length];
      const doorNum = sysDef.code === 'ACS' ? Math.ceil(j / 2) : null;
      const runNum = sysDef.code === 'ACS' ? ((j - 1) % 2) + 1 : null;

      const cableId =
        sysDef.code === 'ACS'
          ? `ACS-D${String(doorNum).padStart(2, '0')}-R${runNum}-${idf}`
          : `${sysDef.code}-${idf}-${String(j).padStart(3, '0')}`;

      const approxLength = 25 + ((i * 7) % 65);
      const backendInScope = Boolean(sysDef.backendInScope);

      // Progress simulation strictly respecting: Pulling -> Termination -> Installation
      const pulling = sysDef.scopePulling ? (j <= Math.ceil(qty * 0.72)) : false;
      const termination = pulling && sysDef.scopeTermination ? (j <= Math.ceil(qty * 0.56)) : false;
      const deviceInstallField = pulling && termination && sysDef.scopeFieldDevice ? (j <= Math.ceil(qty * 0.45)) : false;
      const backendDone = pulling && termination && backendInScope ? (j <= Math.ceil(qty * 0.35)) : false;

      const isRedFlag = (j % 19 === 0 && j > Math.ceil(qty * 0.45)) || (sysDef.code === 'FIBER' && j === 14);
      const pendingReason = isRedFlag ? BLOCKER_REASONS[(i + sysIdx) % BLOCKER_REASONS.length] : '';

      const itemLabel =
        sysDef.code === 'ACS'
          ? `Door ${doorNum}/${doorsCount} (Run ${runNum} of 2)`
          : sysDef.code === 'CCTV'
          ? `Camera ${j}/${qty}`
          : sysDef.code === 'MCLK'
          ? `Clock ${j}/${qty}`
          : sysDef.code === 'PA'
          ? `Speaker ${j}/${qty}`
          : sysDef.code === 'SCS'
          ? `Point ${j}/${qty}`
          : `Fiber Run ${j}/${qty}`;

      const remarks = isRedFlag
        ? `[${sysDef.name} • ${itemLabel}] ${sysDef.scopeSummary} Pending clearance at ${room} (${floor}).`
        : `[${itemLabel}] ${sysDef.scopeSummary}`;

      records.push({
        id: `CBL-${String(i).padStart(4, '0')}`,
        slNo: i,
        cableId,
        systemCode: sysDef.code,
        systemName: sysDef.name,
        systemScope: sysDef.scopeSummary,
        scopePulling: Boolean(sysDef.scopePulling),
        scopeTermination: Boolean(sysDef.scopeTermination),
        scopeFieldDevice: Boolean(sysDef.scopeFieldDevice),
        scopeBackend: backendInScope,
        floor,
        room,
        idf,
        cableType: sysDef.cableType,
        approxLength,
        pulling,
        termination,
        deviceInstallField,
        backendInScope,
        backendDone,
        isRedFlag,
        pendingReason,
        remarks,
        notes: remarks,
        updatedBy,
        updatedAt: new Date().toISOString()
      });
    }
  });

  return records;
}

// Read embedded HTML persistence block if present
function readEmbeddedHtmlState() {
  try {
    const el = document.getElementById('persisted-project-state');
    if (el && el.textContent) {
      return JSON.parse(el.textContent);
    }
  } catch {}
  return null;
}

// ============================================================================
// 3. MAIN APPLICATION COMPONENT
// ============================================================================

    if (embeddedState?.branding) {

    return DEFAULT_PROJECT_INFO;
  });

  }, [branding]);

  // Auth & Secured Role-Based Access State

      return embeddedState.authorizedUsers;
    }

  });
  const [currentSession, setCurrentSession] = useState(() => {
    try {
      if (window.name && window.name.startsWith('ELV_SESSION:')) {

    return null;
  });

  const [showDataExchangeModal, setShowDataExchangeModal] = useState(false);

  const techName = currentSession?.name || 'Unauthorized User';
  const userRole = currentSession?.role || 'VIEWER';
  const canEditField = userRole === 'ADMIN' || userRole === 'ENGINEER';
  const isAdmin = userRole === 'ADMIN';

  // Core Cable Records
  const [cables, setCables] = useState(() => {
    if (Array.isArray(embeddedState?.cables) && embeddedState.cables.length > 0) {
      return embeddedState.cables;
    }
    return [];
  });
  const [loading, setLoading] = useState(() => !(Array.isArray(embeddedState?.cables) && embeddedState.cables.length > 0));
  const [syncStatus, setSyncStatus] = useState('connecting');

  // Navigation & Filters
  const [activeTab, setActiveTab] = useState('schedule'); // 'schedule' | 'dashboard'
  const [searchQuery, setSearchQuery] = useState('');
  const [idfFilter, setIdfFilter] = useState('ALL');
  const [floorFilter, setFloorFilter] = useState('ALL');
  const [statusFilter, setStatusFilter] = useState('ALL');
  const [onlyRedFlags, setOnlyRedFlags] = useState(false);

  // Modals, Drawers & Notifications
  const [selectedCable, setSelectedCable] = useState(null);
  const [flagModalCable, setFlagModalCable] = useState(null);
  const [showReportModal, setShowReportModal] = useState(false);
  const [showBulkScopeModal, setShowBulkScopeModal] = useState(false);
  const [showAddModal, setShowAddModal] = useState(false);
  const [showConfirmSeedModal, setShowConfirmSeedModal] = useState(false);
  const [toast, setToast] = useState(null);

  const showToast = (message, type = 'success') => {
    setToast({ message, type });
    setTimeout(() => {
      setToast((prev) => (prev?.message === message ? null : prev));
    }, 3600);
  };

  // Auto-persist branding, roster, cables, and updated HTML snapshot whenever state changes
  useEffect(() => {
    try {
      localStorage.setItem(BRANDING_STORAGE_KEY, JSON.stringify(branding));
      const colPath = `artifacts/${appId}/public/data/cables`;
      if (cables.length > 0) {
        localStorage.setItem(`STORAGE_${colPath}`, JSON.stringify(cables));
      }
      const usersPath = `artifacts/${appId}/public/data/authorized_users`;
      if (authorizedUsers.length > 0) {
        localStorage.setItem(`STORAGE_${usersPath}`, JSON.stringify(authorizedUsers));
      }
      const htmlSnapshot = buildPersistedHtmlSnapshot(branding, authorizedUsers, cables);
      localStorage.setItem(LIVE_HTML_SNAPSHOT_KEY, htmlSnapshot);
    } catch {}
  }, [branding, authorizedUsers, cables]);

  // Save Project Info, Title, Description, Location & Branding (Admin Only)
  const handleSaveBranding = (newBranding) => {
    if (!isAdmin) return;
    setBranding(newBranding);
    try {
      localStorage.setItem(BRANDING_STORAGE_KEY, JSON.stringify(newBranding));
      const htmlSnapshot = buildPersistedHtmlSnapshot(newBranding, authorizedUsers, cables);
      localStorage.setItem(LIVE_HTML_SNAPSHOT_KEY, htmlSnapshot);
    } catch {}
    applyBrandingToDocument(newBranding);
    showToast('Saved project info & updated HTML snapshot automatically');
  };

  // --------------------------------------------------------------------------
  // 3.1 FIREBASE / LOCAL AUTHENTICATION
  // --------------------------------------------------------------------------
  useEffect(() => {
    let unsubAuth = () => {};
    try {
      unsubAuth = onAuthStateChanged(auth, async (firebaseUser) => {
        if (firebaseUser) {
          setUser(firebaseUser);
        } else {
          try {
            const cred = await signInAnonymously(auth);
            setUser(cred.user);
          } catch (err) {
            setSyncStatus('offline');
            setCables((prev) => (prev.length > 0 ? prev : generateSystemScheduleRecords('Local Session')));
            setLoading(false);
          }
        }
      });
    } catch (err) {
      setSyncStatus('offline');
      setCables((prev) => (prev.length > 0 ? prev : generateSystemScheduleRecords('Local Session')));
      setLoading(false);
    }
    return () => unsubAuth();
  }, []);

  // --------------------------------------------------------------------------
  // 3.2 SEED DATABASE HELPER
  // --------------------------------------------------------------------------
  const seedDatabase = async (silent = false) => {
    const sampleData = generateSystemScheduleRecords(techName || 'Project Manager');
    setCables(sampleData);
    setLoading(false);

    if (user && syncStatus === 'live') {
      try {
        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'cables');
        for (let i = 0; i < sampleData.length; i += 400) {
          const batch = writeBatch(db);
          sampleData.slice(i, i + 400).forEach((item) => {
            batch.set(doc(colRef, item.id), item);
          });
          await batch.commit();
        }
      } catch (err) {
        console.warn('Could not write seed batch:', err);
      }
    }
    if (!silent) {
      showToast('Loaded master schedule & updated HTML');
    }
  };

  // --------------------------------------------------------------------------
  // 3.3 STORAGE / FIRESTORE REAL-TIME LISTENER
  // --------------------------------------------------------------------------
  useEffect(() => {
    if (!user) return;

    const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'cables');
    const unsubCables = onSnapshot(
      colRef,
      async (snapshot) => {
        setSyncStatus('live');
        if (snapshot.empty) {
          if (cables.length > 0) {
            try {
              const batch = writeBatch(db);
              cables.slice(0, 400).forEach((item) => batch.set(doc(colRef, item.id), item));
              await batch.commit();
            } catch {}
            setLoading(false);
          } else {
            await seedDatabase(true);
          }
        } else {
          const list = [];
          snapshot.forEach((docSnap) => {
            list.push({ id: docSnap.id, ...docSnap.data() });
          });
          list.sort((a, b) => (Number(a.slNo) || 9999) - (Number(b.slNo) || 9999));
          setCables(list);
          setLoading(false);
        }
      },
      (error) => {
        setSyncStatus('offline');
        setCables((prev) => (prev.length === 0 ? generateSystemScheduleRecords('Local Session') : prev));
        setLoading(false);
      }
    );

    const usersColRef = collection(db, 'artifacts', appId, 'public', 'data', 'authorized_users');
    const unsubUsers = onSnapshot(
      usersColRef,
      async (snapshot) => {
        if (snapshot.empty) {
          try {
            const batch = writeBatch(db);
            authorizedUsers.forEach((u) => {
              batch.set(doc(usersColRef, u.id), u);
            });
            await batch.commit();
          } catch (e) {}
        } else {
          const roster = [];
          snapshot.forEach((docSnap) => {
            roster.push({ id: docSnap.id, ...docSnap.data() });
          });
          setAuthorizedUsers(roster);
          if (currentSession) {
            const freshUser = roster.find((u) => u.id === currentSession.id);
            if (freshUser && !freshUser.active) {
              handleLogout();
              showToast('Access revoked by Project Manager', 'error');
            } else if (freshUser && freshUser.role !== currentSession.role) {
              const updatedSess = { ...currentSession, role: freshUser.role, name: freshUser.name };
              setCurrentSession(updatedSess);
              try {
                window.name = 'ELV_SESSION:' + JSON.stringify(updatedSess);
              } catch {}
            }
          }
        }
      },
      () => {}
    );

    return () => {
      unsubCables();
      unsubUsers();
    };
  }, [user]);

  // --------------------------------------------------------------------------
  // 3.4 AUTH & USER ROSTER HANDLERS
  // --------------------------------------------------------------------------
  const handleLoginSuccess = (matchedUser) => {
    const sessionObj = {
      id: matchedUser.id,
      name: matchedUser.name,
      email: matchedUser.email,
      role: matchedUser.role
    };
    setCurrentSession(sessionObj);
    try {
      window.name = 'ELV_SESSION:' + JSON.stringify(sessionObj);
    } catch {}
    showToast(`Signed in as ${matchedUser.name}`);
  };

  const handleLogout = () => {
    setCurrentSession(null);
    setSelectedCable(null);
    setFlagModalCable(null);
    try {
      window.name = '';
    } catch {}
  };

  const handleSaveAuthorizedUser = async (userRecord) => {
    const updatedRoster = authorizedUsers.some((u) => u.id === userRecord.id)
      ? authorizedUsers.map((u) => (u.id === userRecord.id ? userRecord : u))
      : [...authorizedUsers, userRecord];
    setAuthorizedUsers(updatedRoster);

    if (user && syncStatus === 'live') {
      try {
        await setDoc(
          doc(db, 'artifacts', appId, 'public', 'data', 'authorized_users', userRecord.id),
          userRecord
        );
      } catch (err) {}
    }
    showToast(`Saved access for ${userRecord.name}`);
  };

  const handleDeleteAuthorizedUser = async (userIdToRemove) => {
    if (userIdToRemove === currentSession?.id) {
      showToast('You cannot remove your own active Admin account', 'error');
      return;
    }
    setAuthorizedUsers((prev) => prev.filter((u) => u.id !== userIdToRemove));
    if (user && syncStatus === 'live') {
      try {
        await deleteDoc(
          doc(db, 'artifacts', appId, 'public', 'data', 'authorized_users', userIdToRemove)
        );
      } catch (err) {}
    }
    showToast('Removed user access', 'info');
  };

  // --------------------------------------------------------------------------
  // 3.5 CABLE CRUD (WITH STRICT STAGE DEPENDENCY RULES) & BULK SCOPE
  // --------------------------------------------------------------------------
  const handleUpdateCable = async (cableId, patch) => {
    if (!canEditField) {
      showToast('Read-only account cannot edit records', 'error');
      return;
    }

    const targetCable = cables.find((c) => c.id === cableId);
    if (!targetCable) return;

    const depCheck = enforceStageDependencies(targetCable, patch);
    if (!depCheck.allowed) {
      showToast(depCheck.reason, 'error');
      return;
    }

    const enrichedPatch = {
      ...depCheck.patch,
      updatedBy: techName,
      updatedAt: new Date().toISOString()
    };

    setCables((prev) =>
      prev.map((item) => (item.id === cableId ? { ...item, ...enrichedPatch } : item))
    );
    setSelectedCable((prev) =>
      prev && prev.id === cableId ? { ...prev, ...enrichedPatch } : prev
    );
    setFlagModalCable((prev) =>
      prev && prev.id === cableId ? { ...prev, ...enrichedPatch } : prev
    );

    if (user && syncStatus === 'live') {
      try {
        await updateDoc(
          doc(db, 'artifacts', appId, 'public', 'data', 'cables', cableId),
          enrichedPatch
        );
      } catch (err) {}
    }
  };

  const handleAddCable = async (newItem) => {
    if (!isAdmin) return;
    const nextSlNo =
      cables.reduce((max, c) => Math.max(max, Number(c.slNo) || 0), 0) + 1;
    const record = {
      id: `CBL-${Date.now()}`,
      slNo: Number(newItem.slNo) || nextSlNo,
      cableId: newItem.cableId.trim(),
      floor: newItem.floor.trim() || 'G',
      room: newItem.room.trim() || 'General',
      idf: newItem.idf.trim() || 'IDF-01',
      cableType: newItem.cableType.trim() || 'Cat6A UTP',
      approxLength: Number(newItem.approxLength) || 0,
      pulling: false,
      termination: false,
      deviceInstallField: false,
      backendInScope: Boolean(newItem.backendInScope),
      backendDone: false,
      isRedFlag: false,
      pendingReason: '',
      remarks: newItem.remarks?.trim() || '',
      notes: newItem.remarks?.trim() || '',
      updatedBy: techName,
      updatedAt: new Date().toISOString()
    };

    setCables((prev) =>
      [...prev, record].sort((a, b) => (Number(a.slNo) || 9999) - (Number(b.slNo) || 9999))
    );

    if (user && syncStatus === 'live') {
      try {
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'cables', record.id), record);
      } catch (err) {}
    }
    showToast(`Added ${record.cableId} & updated HTML`);
  };

  const handleDeleteCable = async (cableId) => {
    if (!isAdmin) return;
    setCables((prev) => prev.filter((c) => c.id !== cableId));
    if (selectedCable?.id === cableId) setSelectedCable(null);

    if (user && syncStatus === 'live') {
      try {
        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'cables', cableId));
      } catch (err) {}
    }
    showToast('Cable deleted & HTML updated', 'info');
  };

  const handleBulkBackendScope = async (inScope, targetIdf = 'ALL') => {
    if (!isAdmin) return;
    const updatedList = cables.map((c) => {
      if (targetIdf !== 'ALL' && c.idf !== targetIdf) return c;
      return {
        ...c,
        backendInScope: inScope,
        backendDone: inScope ? c.backendDone : false,
        updatedBy: techName,
        updatedAt: new Date().toISOString()
      };
    });
    setCables(updatedList);

    if (user && syncStatus === 'live') {
      try {
        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'cables');
        const affected = updatedList.filter((c) => targetIdf === 'ALL' || c.idf === targetIdf);
        for (let i = 0; i < affected.length; i += 400) {
          const batch = writeBatch(db);
          affected.slice(i, i + 400).forEach((item) => {
            batch.update(doc(colRef, item.id), {
              backendInScope: item.backendInScope,
              backendDone: item.backendDone,
              updatedBy: techName,
              updatedAt: item.updatedAt
            });
          });
          await batch.commit();
        }
      } catch (err) {}
    }
    showToast(
      `Backend scope set to ${inScope ? 'IN SCOPE' : 'OUT OF SCOPE'} (${targetIdf})`
    );
  };

  const handleExportReadableCSV = (recordsToExport = cables, filePrefix = 'ELV_Master_Schedule') => {
    const headers = [
      'Sl_No',
      'Cable_ID',
      'Floor',
      'Room_Location',
      'IDF_Room',
      'Cable_Type',
      'Approx_Expected_Length_m',
      'Pulling_Done (YES/NO)',
      'Termination_Done (YES/NO)',
      'Field_Device_Installed (YES/NO)',
      'Backend_In_Scope (YES/NO)',
      'Backend_Done (YES/NO)',
      'Red_Flag_Blocker (YES/NO)',
      'Pending_Blocker_Reason',
      'Site_Remarks',
      'Computed_Status_Auto'
    ];

    const escapeCsv = (val) => `"${String(val ?? '').replace(/"/g, '""')}"`;

    const rows = recordsToExport.map((c) => [
      c.slNo,
      c.cableId,
      c.floor,
      c.room,
      c.idf,
      c.cableType,
      c.approxLength,
      c.pulling ? 'YES' : 'NO',
      c.termination ? 'YES' : 'NO',
      c.deviceInstallField ? 'YES' : 'NO',
      c.backendInScope ? 'YES' : 'NO',
      c.backendInScope ? (c.backendDone ? 'YES' : 'NO') : 'N/A',
      c.isRedFlag ? 'YES' : 'NO',
      c.pendingReason || '',
      c.remarks || c.notes || '',
      evaluateCableStatus(c)
    ]);

    const csvContent = '\uFEFF' + [headers, ...rows].map((r) => r.map(escapeCsv).join(',')).join('\n');
    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `${filePrefix}_${new Date().toISOString().slice(0, 10)}.csv`;
    link.click();
    URL.revokeObjectURL(url);
    showToast(`Exported ${recordsToExport.length} rows to Excel-ready CSV`);
  };

  const handleApplyImportedRecords = async (importedList, importMode = 'REPLACE') => {
    if (!isAdmin) return;
    let finalSchedule = [];

    if (importMode === 'MERGE') {
      const existingByCableId = new Map(
        cables.map((c) => [String(c.cableId).trim().toLowerCase(), c])
      );
      const mergedMap = new Map(cables.map((c) => [c.id, c]));

      importedList.forEach((imp, idx) => {
        const key = String(imp.cableId).trim().toLowerCase();
        const match = existingByCableId.get(key);
        if (match) {
          mergedMap.set(match.id, {
            ...match,
            ...imp,
            id: match.id,
            updatedBy: techName,
            updatedAt: new Date().toISOString()
          });
        } else {
          const newId = `CBL-IMP-${Date.now()}-${idx}`;
          mergedMap.set(newId, {
            ...imp,
            id: newId,
            updatedBy: techName,
            updatedAt: new Date().toISOString()
          });
        }
      });

      finalSchedule = Array.from(mergedMap.values()).sort(
        (a, b) => (Number(a.slNo) || 9999) - (Number(b.slNo) || 9999)
      );
    } else {
      finalSchedule = importedList
        .map((imp, idx) => ({
          ...imp,
          id: `CBL-IMP-${String(idx + 1).padStart(4, '0')}`,
          updatedBy: techName,
          updatedAt: new Date().toISOString()
        }))
        .sort((a, b) => (Number(a.slNo) || 9999) - (Number(b.slNo) || 9999));
    }

    setCables(finalSchedule);

    try {
      const colPath = `artifacts/${appId}/public/data/cables`;
      localStorage.setItem(`STORAGE_${colPath}`, JSON.stringify(finalSchedule));
      if (user && syncStatus === 'live') {
        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'cables');
        for (let i = 0; i < finalSchedule.length; i += 400) {
          const batch = writeBatch(db);
          finalSchedule.slice(i, i + 400).forEach((item) => {
            batch.set(doc(colRef, item.id), item);
          });
          await batch.commit();
        }
      }
    } catch (err) {
      console.error('Storage sync error after import:', err);
    }

    showToast(
      importMode === 'MERGE'
        ? `Merged & updated ${importedList.length} records (${finalSchedule.length} total)`
        : `Replaced schedule with ${importedList.length} imported records`
    );
  };

  // --------------------------------------------------------------------------
  // 3.6 DERIVED ANALYTICS & FILTERED SCHEDULE
  // --------------------------------------------------------------------------
  const uniqueIdfs = useMemo(
    () => Array.from(new Set(cables.map((c) => c.idf).filter(Boolean))).sort(),
    [cables]
  );

  const uniqueFloors = useMemo(
    () => Array.from(new Set(cables.map((c) => c.floor).filter(Boolean))),
    [cables]
  );

  const stats = useMemo(() => {
    const total = cables.length;
    let pulled = 0;
    let terminated = 0;
    let fieldInstalled = 0;
    let backendScopedCount = 0;
    let backendCompleted = 0;
    let completed = 0;
    let redFlags = 0;
    let totalLength = 0;

    cables.forEach((c) => {
      totalLength += Number(c.approxLength) || 0;
      if (c.pulling) pulled++;
      if (c.termination) terminated++;
      if (c.deviceInstallField) fieldInstalled++;
      if (c.backendInScope) {
        backendScopedCount++;
        if (c.backendDone) backendCompleted++;
      }
      if (evaluateCableStatus(c) === 'COMPLETED') completed++;
      if (c.isRedFlag) redFlags++;
    });

    const pct = (n, d) => (d > 0 ? Math.round((n / d) * 100) : 0);

    const pullRatio = total > 0 ? pulled / total : 0;
    const termRatio = total > 0 ? terminated / total : 0;
    const fieldRatio = total > 0 ? fieldInstalled / total : 0;
    const backendRatio =
      backendScopedCount > 0 ? backendCompleted / backendScopedCount : fieldRatio;

    const weightedPct = Math.round(
      (pullRatio * 0.3 + termRatio * 0.3 + fieldRatio * 0.25 + backendRatio * 0.15) * 100
    );

    return {
      total,
      pulled,
      pulledPct: pct(pulled, total),
      terminated,
      terminatedPct: pct(terminated, total),
      fieldInstalled,
      fieldInstalledPct: pct(fieldInstalled, total),
      backendScopedCount,
      backendCompleted,
      backendPct: pct(backendCompleted, backendScopedCount),
      completed,
      completedPct: pct(completed, total),
      redFlags,
      totalLength,
      weightedPct
    };
  }, [cables]);

  const idfSummary = useMemo(() => {
    const map = {};
    cables.forEach((c) => {
      const key = c.idf || 'Unassigned';
      if (!map[key]) {
        map[key] = {
          name: key,
          total: 0,
          pulled: 0,
          terminated: 0,
          fieldInstalled: 0,
          completed: 0,
          redFlags: 0
        };
      }
      map[key].total++;
      if (c.pulling) map[key].pulled++;
      if (c.termination) map[key].terminated++;
      if (c.deviceInstallField) map[key].fieldInstalled++;
      if (evaluateCableStatus(c) === 'COMPLETED') map[key].completed++;
      if (c.isRedFlag) map[key].redFlags++;
    });
    return Object.values(map).sort((a, b) => a.name.localeCompare(b.name));
  }, [cables]);

  const floorSummary = useMemo(() => {
    const map = {};
    cables.forEach((c) => {
      const key = c.floor || 'Unassigned';
      if (!map[key]) {
        map[key] = { name: key, total: 0, completed: 0, redFlags: 0 };
      }
      map[key].total++;
      if (evaluateCableStatus(c) === 'COMPLETED') map[key].completed++;
      if (c.isRedFlag) map[key].redFlags++;
    });
    return Object.values(map);
  }, [cables]);

  const systemSummary = useMemo(() => {
    const defMap = {};
    ELV_SYSTEM_DEFINITIONS.forEach((d) => {
      defMap[d.code] = d;
    });

    const map = {};
    cables.forEach((c) => {
      const prefixCode =
        c.systemCode ||
        String(c.cableId || '').split('-')[0] ||
        'OTHER';
      const def = defMap[prefixCode];
      const key = def ? def.code : prefixCode;
      if (!map[key]) {
        map[key] = {
          code: key,
          name: c.systemName || (def ? def.name : key),
          scopeSummary: c.systemScope || (def ? def.scopeSummary : ''),
          total: 0,
          pulled: 0,
          terminated: 0,
          fieldInstalled: 0,
          completed: 0,
          redFlags: 0
        };
      }
      map[key].total++;
      if (c.pulling) map[key].pulled++;
      if (c.termination) map[key].terminated++;
      if (c.deviceInstallField) map[key].fieldInstalled++;
      if (evaluateCableStatus(c) === 'COMPLETED') map[key].completed++;
      if (c.isRedFlag) map[key].redFlags++;
    });
    return Object.values(map);
  }, [cables]);

  const flaggedCables = useMemo(() => cables.filter((c) => c.isRedFlag), [cables]);

  const filteredCables = useMemo(() => {
    const q = searchQuery.trim().toLowerCase();
    if (q.startsWith('sys:')) {
      const codeTarget = q.slice(4).toUpperCase();
      return cables.filter((c) => {
        if (idfFilter !== 'ALL' && c.idf !== idfFilter) return false;
        if (floorFilter !== 'ALL' && c.floor !== floorFilter) return false;
        if (onlyRedFlags && !c.isRedFlag) return false;
        const st = evaluateCableStatus(c);
        if (statusFilter !== 'ALL' && st !== statusFilter) return false;
        const prefix = c.systemCode || String(c.cableId || '').split('-')[0] || '';
        return prefix.toUpperCase() === codeTarget;
      });
    }
    return cables.filter((c) => {
      if (idfFilter !== 'ALL' && c.idf !== idfFilter) return false;
      if (floorFilter !== 'ALL' && c.floor !== floorFilter) return false;
      if (onlyRedFlags && !c.isRedFlag) return false;

      const st = evaluateCableStatus(c);
      if (statusFilter !== 'ALL' && st !== statusFilter) return false;

      if (!q) return true;
      const haystack = [
        c.slNo,
        c.cableId,
        c.floor,
        c.room,
        c.idf,
        c.cableType,
        c.pendingReason,
        c.remarks,
        c.notes
      ]
        .join(' ')
        .toLowerCase();
      return haystack.includes(q);
    });
  }, [cables, searchQuery, idfFilter, floorFilter, statusFilter, onlyRedFlags]);

  // --------------------------------------------------------------------------

function AdminDataExchangeModal({
  cables,
  onClose,
  onExportFull,
  onExportTemplate,
  onImportValidated
}) {
  const [parsedRows, setParsedRows] = useState(null);
  const [parseErrors, setParseErrors] = useState([]);
  const [importMode, setImportMode] = useState('MERGE'); // 'MERGE' | 'REPLACE'
  const [fileName, setFileName] = useState('');
  const uploadRef = useRef(null);

  const parseCsvFlexible = (text) => {
    const cleanText = text.replace(/^\uFEFF/, '');
    const lines = cleanText.split(/\r?\n/).filter((l) => l.trim().length > 0);
    if (lines.length < 2) {
      return { rows: [], errors: ['File has no data rows below the header.'] };
    }

    const parseLine = (line) => {
      const out = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"' && line[i + 1] === '"') {
          cur += '"';
          i++;
        } else if (ch === '"') {
          inQuotes = !inQuotes;
        } else if (ch === ',' && !inQuotes) {
          out.push(cur.trim());
          cur = '';
        } else {
          cur += ch;
        }
      }
      out.push(cur.trim());
      return out;
    };

    const rawHeaders = parseLine(lines[0]).map((h) =>
      h.toLowerCase().replace(/\(.*?\)/g, '').replace(/[^a-z0-9]/g, '')
    );

    const findCol = (...candidates) =>
      rawHeaders.findIndex((h) => candidates.some((cand) => h.includes(cand)));

    const idxSl = findCol('slno', 'sl');
    const idxCableId = findCol('cableid', 'tag');
    const idxFloor = findCol('floor', 'level');
    const idxRoom = findCol('room', 'location', 'area');
    const idxIdf = findCol('idf', 'rack');
    const idxType = findCol('cabletype', 'type');
    const idxLen = findCol('length', 'len');
    const idxPull = findCol('pulling', 'pull');
    const idxTerm = findCol('termination', 'term');
    const idxDev = findCol('fielddevice', 'deviceinstall', 'device');
    const idxBackScope = findCol('backendinscope', 'inscope', 'scope');
    const idxBackDone = findCol('backenddone', 'backend');
    const idxFlag = findCol('redflag', 'flag');
    const idxReason = findCol('pendingblocker', 'reason', 'blocker');
    const idxRemarks = findCol('remarks', 'notes', 'comment');

    const toBool = (v) =>
      ['true', 'yes', 'y', '1', 'done', 'completed', 'x', '✓'].includes(
        String(v || '').trim().toLowerCase()
      );

    const rows = [];
    const errors = [];

    lines.slice(1).forEach((line, idx) => {
      const cols = parseLine(line);
      const getVal = (colIdx, fallbackIdx) =>
        colIdx >= 0 ? cols[colIdx] : cols[fallbackIdx];

      const cableId = String(getVal(idxCableId, 1) || '').trim();
      if (!cableId) {
        errors.push(`Row ${idx + 2}: Missing Cable_ID — skipped.`);
        return;
      }

      const rawScope = getVal(idxBackScope, 10);
      const backendInScope =
        rawScope === undefined || rawScope === '' ? true : toBool(rawScope);

      const rawLen = Number(getVal(idxLen, 6));
      if (Number.isNaN(rawLen) || rawLen < 0) {
        errors.push(`Row ${idx + 2} (${cableId}): Invalid length "${getVal(idxLen, 6)}", defaulted to 0.`);
      }

      const pulling = toBool(getVal(idxPull, 7));
      const termination = pulling ? toBool(getVal(idxTerm, 8)) : false;
      const deviceInstallField = pulling && termination ? toBool(getVal(idxDev, 9)) : false;
      const backendDone = pulling && termination && backendInScope ? toBool(getVal(idxBackDone, 11)) : false;

      rows.push({
        slNo: Number(getVal(idxSl, 0)) || idx + 1,
        cableId,
        floor: String(getVal(idxFloor, 2) || 'G').trim(),
        room: String(getVal(idxRoom, 3) || 'General').trim(),
        idf: String(getVal(idxIdf, 4) || 'IDF-01').trim(),
        cableType: String(getVal(idxType, 5) || 'Cat6A UTP LSZH').trim(),
        approxLength: Number.isNaN(rawLen) || rawLen < 0 ? 0 : rawLen,
        pulling,
        termination,
        deviceInstallField,
        backendInScope,
        backendDone,
        isRedFlag: toBool(getVal(idxFlag, 12)),
        pendingReason: String(getVal(idxReason, 13) || '').trim(),
        remarks: String(getVal(idxRemarks, 14) || '').trim(),
        notes: String(getVal(idxRemarks, 14) || '').trim()
      });
    });

    return { rows, errors };
  };

  const handleFilePicked = (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setFileName(file.name);
    const reader = new FileReader();
    reader.onload = (evt) => {
      const { rows, errors } = parseCsvFlexible(String(evt.target?.result || ''));
      setParsedRows(rows);
      setParseErrors(errors);
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  return (
    <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl max-w-3xl w-full shadow-2xl border border-slate-200 overflow-hidden max-h-[90vh] flex flex-col">
        <div className="bg-slate-900 text-white px-5 py-4 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <FileSpreadsheet className="w-5 h-5 text-amber-400" />
            <div>
              <h3 className="font-bold text-sm">Admin Excel / CSV Export &amp; Re-Upload Manager</h3>
              <p className="text-[11px] text-slate-400">
                Human-readable columns with YES/NO checkboxes &amp; Approx. (expected) lengths
              </p>
            </div>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-white cursor-pointer">
            <X className="w-5 h-5" />
          </button>
        </div>

        <div className="p-5 overflow-y-auto space-y-5 text-xs">
          <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 space-y-2.5">
            <div className="font-extrabold text-slate-900 text-sm">
              Step 1: Download Human-Readable CSV for Excel / Google Sheets
            </div>
            <p className="text-slate-600 leading-relaxed">
              Columns use clear headers (<code className="bg-slate-200 px-1 rounded">Sl_No</code>,{' '}
              <code className="bg-slate-200 px-1 rounded">Cable_ID</code>,{' '}
              <code className="bg-slate-200 px-1 rounded">Approx_Expected_Length_m</code>,{' '}
              <code className="bg-slate-200 px-1 rounded">Pulling_Done (YES/NO)</code>, etc.) so
              you can edit lengths, statuses, or remarks in Excel and re-upload seamlessly.
            </p>
            <div className="flex flex-wrap gap-2 pt-1">
              <button
                type="button"
                onClick={onExportFull}
                className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-bold cursor-pointer"
              >
                <Download className="w-4 h-4" />
                <span>Download Full Schedule CSV ({cables.length} rows)</span>
              </button>
              <button
                type="button"
                onClick={onExportTemplate}
                className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 font-semibold cursor-pointer"
              >
                <Download className="w-4 h-4 text-sky-600" />
                <span>Download Sample Template (5 rows)</span>
              </button>
            </div>

function SecuredLoginScreen({ branding, authorizedUsers, syncStatus, totalCablesCount = 668, onLogin }) {
  const [identifierInput, setIdentifierInput] = useState('');
  const [pinInput, setPinInput] = useState('');
  const [errorMsg, setErrorMsg] = useState('');

  const handleSubmit = (e) => {
    e.preventDefault();
    setErrorMsg('');

    const idQuery = identifierInput.trim().toLowerCase();
    const pinQuery = pinInput.trim();

    if (!idQuery || !pinQuery) {
      setErrorMsg('Please enter your User ID, Name, or Email and your Access PIN.');
      return;
    }

    const activeUsers = authorizedUsers.filter((u) => u.active !== false);
    const matchedUser = activeUsers.find((u) => {
      const matchesIdOrEmail =
        String(u.id || '').toLowerCase() === idQuery ||
        String(u.email || '').toLowerCase() === idQuery ||
        String(u.name || '').toLowerCase() === idQuery;
      return matchesIdOrEmail && String(u.pin).trim() === pinQuery;
    });

    if (!matchedUser) {
      setErrorMsg('Invalid credentials or inactive account. Please verify your user identifier and PIN.');
      return;
    }

    onLogin(matchedUser);
  };

  return (
    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 font-sans">
      <div className="max-w-md w-full bg-white rounded-2xl shadow-2xl overflow-hidden border border-slate-800">
        <div className="bg-slate-950 text-white p-6 text-center border-b border-slate-800">
          <div className="w-12 h-12 rounded-2xl bg-blue-600/20 border border-blue-500/40 flex items-center justify-center mx-auto mb-3 shadow-lg overflow-hidden">
            <img
              src={branding?.faviconUrl || DEFAULT_FAVICON_URI}
              alt="Logo"
              className="w-9 h-9 object-contain"
            />
          </div>
          {branding?.projectCode && (
            <div className="text-[11px] font-mono font-bold text-blue-300 mb-1">
              {branding.projectCode}
            </div>
          )}
          <h1 className="text-lg font-extrabold tracking-tight">
            {branding?.projectTitle || DEFAULT_PROJECT_INFO.projectTitle}
          </h1>
          {branding?.location && (
            <p className="text-[11px] text-sky-300 mt-1 flex items-center justify-center gap-1">
              <MapPin className="w-3 h-3 shrink-0" />
              <span>{branding.location}</span>
            </p>
          )}
          <p className="text-xs text-slate-400 mt-1">
            Secured Sign-In • {totalCablesCount} Cables &amp; Devices Schedule
          </p>
          <div className="mt-3 inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-900 border border-slate-800 text-[11px] text-slate-300">
            <span
              className={`w-2 h-2 rounded-full ${
                syncStatus === 'live' ? 'bg-emerald-400' : 'bg-amber-400'
              }`}
            />
            <span>
              {syncStatus === 'live' ? 'Live Directory Connected' : 'Local Directory Ready'}
            </span>
          </div>
        </div>

        <form onSubmit={handleSubmit} className="p-6 space-y-4 text-xs" autoComplete="off">
          <div>
            <label className="block font-bold text-slate-700 mb-1.5">
              User Name, Email, or User ID
            </label>
            <input
              type="text"
              value={identifierInput}
              onChange={(e) => {
                setIdentifierInput(e.target.value);
                setErrorMsg('');
              }}
              placeholder="Enter your authorized email, name, or ID"
              className="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-medium text-slate-900 focus:bg-white focus:border-blue-600 outline-none"
            />
          </div>

          <div>
            <label className="block font-bold text-slate-700 mb-1.5">
              Access PIN
            </label>
            <div className="relative">
              <KeyRound className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
              <input
                type="password"
                inputMode="numeric"
                maxLength={12}
                value={pinInput}
                onChange={(e) => {
                  setPinInput(e.target.value);
                  setErrorMsg('');
                }}
                placeholder="Enter your PIN"
                className="w-full pl-9 pr-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm font-mono tracking-widest focus:bg-white focus:border-blue-600 outline-none"
              />
            </div>
          </div>

          {errorMsg && (
            <div className="p-2.5 rounded-lg bg-red-50 border border-red-300 text-red-800 font-semibold">
              {errorMsg}
            </div>
          )}

          <button
            type="submit"
            className="w-full py-3 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm shadow transition cursor-pointer"
          >
            Sign In
          </button>
        </form>
      </div>
    </div>
  );
}

function TeamAccessManagerModal({
  authorizedUsers,
  currentUserId,
  onClose,
  onSaveUser,
  onDeleteUser
}) {
  const [name, setName] = useState('');
  const [email, setEmail] = useState('');
  const [role, setRole] = useState('ENGINEER');
  const [pin, setPin] = useState('');

  const handleAdd = (e) => {
    e.preventDefault();
    if (!name.trim() || !pin.trim()) return;
    onSaveUser({
      id: 'USR-' + Date.now(),
      name: name.trim(),
      email: email.trim() || 'team@project.com',
      role,
      pin: pin.trim(),
      active: true
    });
    setName('');
    setEmail('');
    setPin('');
  };

  return (
    <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
      <div className="bg-white rounded-2xl max-w-2xl w-full shadow-2xl border border-slate-200 overflow-hidden max-h-[88vh] flex flex-col">
        <div className="bg-slate-900 text-white px-5 py-4 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <Users className="w-5 h-5 text-purple-400" />
            <div>
              <h3 className="font-bold text-base">Team Access Control & User Permissions</h3>
              <p className="text-[11px] text-slate-400">
                Add or revoke access for Site Engineers, Project Managers, and Client Reviewers
              </p>
            </div>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-white cursor-pointer">
            <X className="w-5 h-5" />
          </button>
        </div>

        <div className="p-5 overflow-y-auto space-y-5 text-xs">
          <form
            onSubmit={handleAdd}
            className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3"
          >
            <div className="font-bold text-slate-800 flex items-center gap-1.5">
              <UserPlus className="w-4 h-4 text-blue-600" />
              <span>Authorize New User</span>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-4 gap-2.5">
              <input
                required
                type="text"
                placeholder="Full Name / Team"
                value={name}
                onChange={(e) => setName(e.target.value)}
                className="px-3 py-2 bg-white border border-slate-300 rounded-lg"
              />
              <input
                type="email"
                placeholder="Email (optional)"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                className="px-3 py-2 bg-white border border-slate-300 rounded-lg"
              />
              <select
                value={role}
                onChange={(e) => setRole(e.target.value)}
                className="px-3 py-2 bg-white border border-slate-300 rounded-lg font-semibold"
              >
                <option value="ENGINEER">Site Engineer (Editor)</option>
                <option value="VIEWER">Client / Consultant (View)</option>
                <option value="ADMIN">Project Manager (Admin)</option>
              </select>
              <div className="flex gap-1.5">
                <input
                  required
                  type="text"
                  maxLength={10}
                  placeholder="PIN"
                  value={pin}
                  onChange={(e) => setPin(e.target.value)}
                  className="w-full px-3 py-2 bg-white border border-slate-300 rounded-lg font-mono"
                />
                <button
                  type="submit"
                  className="px-3 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-bold shrink-0 cursor-pointer"
                >
                  Add
                </button>
              </div>
            </div>
          </form>

          <div className="border border-slate-200 rounded-xl overflow-hidden">
            <table className="w-full text-left border-collapse">
              <thead>
                <tr className="bg-slate-100 text-slate-600 text-[11px] uppercase">
                  <th className="py-2.5 px-3">User Name</th>
                  <th className="py-2.5 px-3">Access Role</th>
                  <th className="py-2.5 px-3">PIN</th>
                  <th className="py-2.5 px-3 text-center">Status</th>
                  <th className="py-2.5 px-3 text-right">Action</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-200">
                {authorizedUsers.map((u) => (
                  <tr key={u.id} className={!u.active ? 'opacity-50 bg-slate-50' : ''}>
                    <td className="py-2.5 px-3">
                      <div className="font-bold text-slate-900">{u.name}</div>
                      <div className="text-[11px] text-slate-400">{u.email}</div>
                    </td>
                    <td className="py-2.5 px-3">
                      <select
                        disabled={u.id === currentUserId}
                        value={u.role}
                        onChange={(e) => onSaveUser({ ...u, role: e.target.value })}
                        className="px-2 py-1 bg-white border border-slate-300 rounded text-[11px] font-semibold"
                      >
                        <option value="ADMIN">ADMIN (Full)</option>
                        <option value="ENGINEER">ENGINEER (Field Edit)</option>
                        <option value="VIEWER">VIEWER (Read-Only)</option>
                      </select>
                    </td>
                    <td className="py-2.5 px-3 font-mono font-bold text-slate-700">{u.pin}</td>
                    <td className="py-2.5 px-3 text-center">
                      <button
                        disabled={u.id === currentUserId}
                        onClick={() => onSaveUser({ ...u, active: !u.active })}
                        className={`px-2 py-0.5 rounded-full text-[10px] font-bold cursor-pointer ${
                          u.active !== false
                            ? 'bg-emerald-100 text-emerald-800'
                            : 'bg-rose-100 text-rose-800'
                        }`}
                      >
                        {u.active !== false ? 'Active' : 'Suspended'}
                      </button>
                    </td>
                    <td className="py-2.5 px-3 text-right">
                      {u.id !== currentUserId ? (
                        <button
                          onClick={() => onDeleteUser(u.id)}
                          className="text-rose-600 hover:text-rose-800 p-1 cursor-pointer"
                          title="Revoke & Delete User"
                        >
                          <Trash2 className="w-4 h-4" />
                        </button>
                      ) : (
                        <span className="text-[10px] text-slate-400 italic">You</span>
                      )}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>

        <div className="px-5 py-3 bg-slate-50 border-t border-slate-200 flex justify-end">
          <button
            onClick={onClose}
            className="px-5 py-2 rounded-lg bg-slate-900 text-white text-xs font-bold cursor-pointer"
          >
            Done
          </button>
        </div>
      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
